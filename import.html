
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DukaStock Product Import</title>
</head>
<body>
    <h2>Import DukaStock Products</h2>

    <input type="file" id="backupFile" accept=".txt">

    <button onclick="importProducts()">Import Products</button>

    <p id="message"></p>

    <script>
        function importProducts() {
            const file = document.getElementById("backupFile").files[0];
            const message = document.getElementById("message");

            if (!file) {
                message.textContent = "Please select your backup file.";
                return;
            }

            const reader = new FileReader();

            reader.onload = function(event) {
                try {
                    const products = JSON.parse(event.target.result);

                    if (!Array.isArray(products)) {
                        throw new Error("Invalid product data");
                    }

                    localStorage.setItem(
                        "dukastock-products",
                        JSON.stringify(products)
                    );

                    message.textContent =
                        "Success! Imported " + products.length + " products.";
                } catch (error) {
                    message.textContent = "Import failed. Check your backup file.";
                }
            };

            reader.readAsText(file);
        }
    </script>
</body>
</html>
